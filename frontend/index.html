<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Library — Книжный магазин и библиотека</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ЭКРАН РЕГИСТРАЦИИ / ВХОДА -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">📚 E-Library</div>
      <p class="auth-subtitle">Зарегистрируйтесь, чтобы открыть каталог и заказать книги</p>

      <div class="auth-switcher">
        <button type="button" class="auth-switch-btn active" id="btnShowReg" onclick="toggleAuthMode('register')">Регистрация</button>
        <button type="button" class="auth-switch-btn" id="btnShowLogin" onclick="toggleAuthMode('login')">Вход</button>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Ваше имя</label>
          <input type="text" id="regName" required placeholder="Александр" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="reader@mail.ru" />
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="regPassword" required placeholder="Придумайте пароль" />
        </div>
        <button type="submit" class="btn-primary w-full">Зарегистрироваться и перейти в каталог</button>
      </form>

      <form id="loginForm" style="display: none;" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="reader@mail.ru" />
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary w-full">Войти в аккаунт</button>
      </form>
    </div>
  </div>

  <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
  <div id="appScreen" style="display: none;">
    <header>
      <div class="logo">📚 E-Library</div>
      <div class="user-panel">
        <span class="user-badge" id="userNameDisplay">👤 Читатель</span>
        <button type="button" class="btn-outline" onclick="logout()">Выйти</button>
      </div>
    </header>

    <main>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="catalog" onclick="switchTab('catalog')">📖 Каталог книг</button>
        <button type="button" class="tab" data-tab="my-books" onclick="switchTab('my-books')">🛍️ Мои купленные книги (<span id="myBooksCount">0</span>)</button>
      </div>

      <section id="catalogView">
        <div class="toolbar">
          <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию или автору..." oninput="filterBooks()" />
          <select id="genreFilter" class="genre-select" onchange="filterBooks()">
            <option value="">Все жанры</option>
          </select>
        </div>
        <div class="grid" id="booksGrid"></div>
      </section>

      <section id="myBooksView" style="display: none;">
        <div class="grid" id="myBooksGrid"></div>
      </section>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ЗАКАЗА -->
  <div class="modal-backdrop" id="orderModal">
    <div class="modal">
      <h2>Оформление заказа</h2>
      <p class="modal-subtitle" id="orderBookTitle">Книга: ...</p>

      <form onsubmit="submitOrder(event)">
        <input type="hidden" id="orderBookId" />
        <div class="form-group">
          <label>ФИО получателя</label>
          <input type="text" id="orderFullName" required placeholder="Иванов Иван Иванович" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Телефон</label>
            <input type="tel" id="orderPhone" required placeholder="+7 (999) 123-45-67" />
          </div>
          <div class="form-group">
            <label>Город</label>
            <input type="text" id="orderCity" required placeholder="Киров" />
          </div>
        </div>
        <div class="form-group">
          <label>Адрес доставки (улица, дом, квартира, индекс)</label>
          <input type="text" id="orderAddress" required placeholder="ул. Ленина, д. 15, кв. 42, 610000" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Способ доставки</label>
            <select id="orderDelivery">
              <option value="Курьером до двери">Курьером до двери</option>
              <option value="Пункт выдачи (ПВЗ)">Пункт выдачи (ПВЗ)</option>
              <option value="Почта России">Почта России</option>
            </select>
          </div>
          <div class="form-group">
            <label>Оплата</label>
            <select id="orderPayment">
              <option value="Картой онлайн">Картой онлайн</option>
              <option value="При получении">При получении</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Комментарий курьеру (необязательно)</label>
          <textarea id="orderComment" rows="2" placeholder="Код домофона, удобное время..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" onclick="closeModals()">Отмена</button>
          <button type="submit" class="btn-success">Купить и заказать</button>
        </div>
      </form>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ВОЗВРАТА -->
  <div class="modal-backdrop" id="returnModal">
    <div class="modal">
      <h2>Возврат книги</h2>
      <p class="modal-subtitle" id="returnBookTitle">Вы оформляете возврат книги...</p>

      <form onsubmit="submitReturn(event)">
        <input type="hidden" id="returnOrderId" />
        <div class="form-group">
          <label>Причина возврата</label>
          <select id="returnReason" required>
            <option value="Уже прочитал, возвращаю в библиотеку">Уже прочитал, возвращаю в библиотеку</option>
            <option value="Не подошёл сюжет / жанр">Не подошёл сюжет / жанр</option>
            <option value="Повреждена обложка при доставке">Повреждена обложка при доставке</option>
            <option value="Заказал по ошибке">Заказал по ошибке</option>
          </select>
        </div>
        <div class="form-group">
          <label>Способ возврата</label>
          <select id="returnMethod">
            <option value="Вызов курьера по адресу доставки">Вызов курьера по адресу доставки</option>
            <option value="Сдать в ближайший пункт выдачи">Сдать в ближайший пункт выдачи</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" onclick="closeModals()">Отмена</button>
          <button type="submit" class="btn-danger">Подтвердить возврат</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
